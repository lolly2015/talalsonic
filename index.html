
<script>
const originalOnlineConnect = connectOnlineGame;
connectOnlineGame = function() {
    if (typeof Peer === 'undefined') { document.getElementById('online-status').innerText = 'تعذر تحميل خدمة الاتصال.'; return; }
    const name = document.getElementById('online-name').value.trim() || 'Player';
    const room = document.getElementById('online-room').value.trim();
    onlineMode = true; freePlayMode = true;
    const status = document.getElementById('online-status');
    status.innerText = room ? 'جاري إنشاء/دخول الغرفة...' : 'جاري إنشاء غرفة...';
    peer = new Peer(room || ('sonic-' + Math.random().toString(36).slice(2, 9)));
    peer.on('open', id => { document.getElementById('online-room').value = id; status.innerText = 'غرفتك جاهزة. شارك هذا الكود: ' + id; startGame(); });
    peer.on('connection', connection => setupPeerConnection(connection, name));
    peer.on('error', error => {
        if (room && error.type === 'unavailable-id') {
            status.innerText = 'الغرفة موجودة، جاري الدخول...';
            peer = new Peer();
            peer.on('open', () => { peerConnection = peer.connect(room, { reliable: true, metadata: { name } }); setupPeerConnection(peerConnection, name); startGame(); });
            peer.on('error', retryError => { status.innerText = 'تعذر الاتصال: ' + retryError.type; });
        } else status.innerText = 'تعذر الاتصال: ' + error.type;
    });
};
    </script>
